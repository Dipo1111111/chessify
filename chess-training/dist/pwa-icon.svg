<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#F8F6F3"/>
  <rect x="8" y="8" width="496" height="496" rx="56" fill="none" stroke="#E0DCD4" stroke-width="4"/>
  <!-- Chess Knight (stylized, minimal) -->
  <g transform="translate(256,280) scale(1)">
    <!-- Knight head and mane -->
    <path d="M-20,-80 C-20,-120 20,-130 40,-110 C60,-90 55,-70 50,-60
             L80,-50 C95,-45 100,-30 95,-20 L90,-5 L60,-10
             C55,0 40,10 20,15 L20,30 L-10,35 L-10,15
             C-25,5 -40,-5 -45,-20
             C-55,-30 -60,-50 -50,-65
             C-40,-75 -30,-70 -20,-80Z"
          fill="#B8653A"/>
    <!-- Eye -->
    <circle cx="10" cy="-75" r="6" fill="#F8F6F3"/>
    <!-- Neck / base -->
    <rect x="-8" y="30" width="24" height="20" rx="3" fill="#A85A30"/>
    <!-- Base platform -->
    <rect x="-30" y="48" width="68" height="12" rx="4" fill="#B8653A"/>
    <!-- Pauldron curve -->
    <path d="M-30,48 C-30,35 -20,25 -10,30"
          stroke="#A85A30" stroke-width="3" fill="none"/>
    <path d="M38,48 C38,35 28,25 18,30"
          stroke="#A85A30" stroke-width="3" fill="none"/>
  </g>
  <!-- Subtle accent at bottom -->
  <circle cx="256" cy="470" r="6" fill="#B8653A" opacity="0.3"/>
</svg>
