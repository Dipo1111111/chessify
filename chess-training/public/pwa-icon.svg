<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#F8F6F3"/>
  <rect x="12" y="12" width="488" height="488" rx="52" fill="none" stroke="#E0DCD4" stroke-width="4"/>

  <!-- "CHESS" wordmark — comfortably centered with padding -->
  <text x="256" y="265"
        font-family="'Playfair Display', 'Georgia', serif"
        font-size="96"
        font-weight="700"
        fill="#B8653A"
        text-anchor="middle"
        dominant-baseline="central"
        letter-spacing="18">
    CHESS
  </text>

  <!-- Decorative line below -->
  <rect x="180" y="320" width="152" height="2" rx="1" fill="#B8653A" opacity="0.35"/>

  <!-- Subtle accent dot -->
